    <script>
      // 渲染前应用主题，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('oscar-theme');
          var resolved;
          if (t === 'light' || t === 'dark') {
            resolved = t;
          } else {
            // system 或未设置：跟随系统
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore */ }
      })();
      // 渲染前应用 edu 主题（classic / notebook），避免闪烁
      (function() {
        try {
          var et = localStorage.getItem('oscar-edu-theme');
          if (et !== 'classic' && et !== 'notebook') et = 'notebook';
          document.documentElement.setAttribute('data-edu-theme', et);
        } catch (e) { /* ignore */ }
      })();
    </script>
