<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
  <meta name="description" content="摘词本 — 英语单词背诵与复习工具，基于 FSRS 自适应复习算法">
  <link rel="canonical" href="https://edu.oscarstudio.cn/%E6%91%98%E8%AF%8D%E6%9C%AC/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Oscar Studio 教学工具">
  <meta property="og:title" content="摘词本 | Oscar Studio 教学工具">
  <meta property="og:description" content="摘词本 — 英语单词背诵与复习工具，基于 FSRS 自适应复习算法">
  <meta property="og:url" content="https://edu.oscarstudio.cn/%E6%91%98%E8%AF%8D%E6%9C%AC/">
  <meta property="og:image" content="https://edu.oscarstudio.cn/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摘词本 | Oscar Studio 教学工具</title>
    <link rel="stylesheet" href="../_shared/design-tokens.css">
    <script src="../_shared/tool-header.js"></script>
    <!-- 未登录立即跳转到登录页，登录成功后会跳回 -->
    <script src="../_shared/auth-guard.js" data-guard="immediate"></script>
    <!-- 算法模块（IIFE，挂在 window） -->
    <script src="./_shared/fsrs-bundle.js"></script>
    <script src="algorithm-fsrs.js"></script>
    <script defer src="https://analytics.oscarstudio.cn/script.js"
        data-website-id="6a75f3bd-26d3-4d27-acbf-282f408254da"></script>
    <link rel="stylesheet" href="wordbook.css?v=20261126-3">
    <script defer src="wordbook.js?v=20261126-3"></script>
    <script defer charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
</head>
<body>
    <div class="workspace">
        <aside class="sidebar">
            <a class="brand" href="#home">
                <span class="brand-mark" data-icon="book"></span>
                <strong>摘词本</strong>
            </a>
            <nav class="navigation" aria-label="摘词本导航">
                <a href="#home" data-page="home"><span data-icon="home"></span>今日学习</a>
                <a href="#library" data-page="library"><span data-icon="library"></span>我的词库<span class="nav-count" id="navCount" hidden></span></a>
            </nav>
            <button class="add-button" type="button" data-add disabled><span data-icon="plus"></span>录入词条</button>
            <button class="settings-button" id="settingsButton" type="button"><span data-icon="settings"></span>学习设置</button>
        </aside>

        <main class="main" id="main">
            <div id="loadState" class="load-state" role="status">
                <p id="loadMessage">正在载入摘词本…</p>
                <button class="button secondary" type="button" id="retryLoad" hidden>重新载入</button>
            </div>
            <section id="homePage" class="page" hidden aria-labelledby="homeTitle">
                <header class="page-heading">
                    <div><p class="eyebrow" id="today"></p><h1 id="homeTitle" tabindex="-1">今日学习</h1></div>
                </header>
                <section class="hero" aria-labelledby="heroTitle">
                    <div class="hero-content">
                        <div class="hero-label"><span data-icon="spark"></span><span id="heroLabel">今日计划</span></div>
                        <h2 id="heroTitle">开始今天的学习</h2>
                        <p id="heroDescription"></p>
                        <button id="heroAction" type="button" class="button hero-button"><span id="heroActionLabel"></span><span data-icon="arrow"></span></button>
                    </div>
                    <div class="hero-art" aria-hidden="true">
                        <div class="orbit orbit-outer"></div><div class="orbit orbit-inner"></div>
                        <div class="art-sheet art-shadow"></div><div class="art-sheet art-pages"></div>
                        <div class="art-sheet art-cover">
                            <i></i><span>Aa</span><div class="art-lines"><b></b><b></b></div>
                            <div class="art-bookmark"></div>
                        </div>
                        <span class="art-star art-star-one">✦</span><span class="art-star art-star-two">✧</span>
                        <i class="art-dot art-dot-one"></i><i class="art-dot art-dot-two"></i>
                    </div>
                </section>
                <section aria-labelledby="activitiesTitle">
                    <div class="section-heading"><h2 id="activitiesTitle">学习任务</h2></div>
                    <div class="activities">
                        <button class="activity" id="reviewAction" type="button">
                            <span class="activity-icon review-icon" data-icon="repeat"></span>
                            <span class="activity-text"><strong>到期复习</strong><small id="reviewSummary"></small></span>
                            <span class="activity-arrow" data-icon="arrow"></span>
                        </button>
                        <button class="activity" id="reciteAction" type="button">
                            <span class="activity-icon recite-icon" data-icon="layers"></span>
                            <span class="activity-text"><strong>背诵新词</strong><small id="reciteSummary"></small></span>
                            <span class="activity-arrow" data-icon="arrow"></span>
                        </button>
                    </div>
                </section>
                <section aria-labelledby="statsTitle">
                    <div class="section-heading"><h2 id="statsTitle">词库概况</h2><a href="#library">查看词库 <span data-icon="arrow"></span></a></div>
                    <dl class="stats">
                        <div><dt>全部词条</dt><dd id="statTotal">0</dd></div>
                        <div><dt>未学习</dt><dd id="statNew">0</dd></div>
                        <div><dt>学习中</dt><dd id="statLearning">0</dd></div>
                        <div><dt>已掌握</dt><dd id="statMastered">0</dd></div>
                    </dl>
                </section>
            </section>

            <section id="libraryPage" class="page" hidden aria-labelledby="libraryTitle">
                <header class="page-heading">
                    <div><h1 id="libraryTitle" tabindex="-1">我的词库</h1><p id="librarySummary"></p></div>
                    <button class="button secondary" id="importButton" type="button"><span data-icon="upload"></span>批量导入</button>
                </header>
                <div class="library">
                    <div class="filters">
                        <label class="search"><span data-icon="search"></span><input id="searchWords" type="search" aria-label="搜索词条" placeholder="搜索词条或释义"></label>
                        <select id="filterStatus" aria-label="按学习状态筛选">
                            <option value="all">全部状态</option><option value="new">未学习</option>
                            <option value="learning">学习中</option><option value="mastered">已掌握</option>
                        </select>
                        <select id="filterSort" aria-label="词条排序">
                            <option value="date-desc">最新添加</option><option value="date-asc">最早添加</option><option value="alpha">字母顺序</option>
                        </select>
                    </div>
                    <ul class="word-list" id="wordList"></ul>
                    <div class="empty" id="libraryEmpty" hidden>
                        <span data-icon="book"></span><h2 id="emptyTitle"></h2><p id="emptyDescription"></p>
                        <div class="empty-actions">
                            <button class="button primary" id="emptyAdd" type="button" data-add>录入词条</button>
                            <button class="button secondary" id="emptyImport" type="button"><span data-icon="upload"></span>批量导入</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="studyPage" class="page study-page" hidden aria-labelledby="studyTitle">
                <header class="page-heading">
                    <div><a class="back-link" href="#home"><span data-icon="back"></span>今日学习</a><h1 id="studyTitle" tabindex="-1"></h1></div>
                </header>
                <div class="study-progress" id="studyProgress">
                    <div><span id="progressLabel"></span><span id="progressCount"></span></div>
                    <progress id="progressBar" aria-label="本组学习进度"></progress>
                </div>
                <article class="study-card" id="studyCard">
                    <p class="eyebrow" id="studyPrompt"></p>
                    <h2 id="studyTranslation"></h2>
                    <div class="study-example" id="studyExample" hidden>
                        <p class="example-sentence" id="studySentence" lang="en"></p>
                        <p class="example-translation" id="studyExampleTranslation"></p>
                        <button class="text-button" id="studyHint" type="button">显示首字母</button>
                        <p id="hintText" class="hint-text" aria-live="polite"></p>
                    </div>
                    <form id="answerForm" class="answer-form">
                        <input id="studyInput" type="text" lang="en" aria-label="英文答案" placeholder="输入英文答案" spellcheck="false" autocomplete="off" autocapitalize="off">
                        <button id="checkAnswer" class="button primary" type="submit">检查答案 <span data-icon="arrow"></span></button>
                    </form>
                    <div id="feedback" class="feedback" role="status" hidden><strong id="feedbackStatus"></strong><span id="feedbackAnswer" lang="en"></span></div>
                    <div id="ratingPanel" class="rating-panel" hidden>
                        <p>这次记得怎么样？</p>
                        <div class="ratings">
                            <button data-rating="1" type="button">忘记<small>Again</small></button>
                            <button data-rating="2" type="button">较难<small>Hard</small></button>
                            <button data-rating="3" type="button">记得<small>Good</small></button>
                            <button data-rating="4" type="button">轻松<small>Easy</small></button>
                        </div>
                    </div>
                    <p class="form-error" id="studyError" role="alert" hidden></p>
                    <div class="study-actions">
                        <button id="retryRating" class="button secondary" type="button" hidden>重试保存</button>
                        <button id="nextWord" class="button primary" type="button" hidden>继续 <span data-icon="arrow"></span></button>
                    </div>
                </article>
                <div class="study-card empty" id="studyDone" hidden>
                    <span data-icon="check"></span><h2 id="doneTitle"></h2><p id="doneDescription"></p>
                    <a class="button primary" href="#home">返回今日学习</a>
                </div>
            </section>
        </main>
    </div>

    <dialog id="entryDialog" aria-labelledby="entryTitle">
        <form id="entryForm" class="dialog-form">
            <div class="dialog-heading"><div><h2 id="entryTitle"></h2><p id="entrySubtitle"></p></div><button class="icon-button" type="button" data-close aria-label="关闭"><span data-icon="close"></span></button></div>
            <div id="entryFields" class="fields">
                <label>单词、短语或词块<input id="wordInput" lang="en" placeholder="例如 look forward to" required autocomplete="off"></label>
                <label>中文释义<input id="transInput" placeholder="例如 期待，盼望" required autocomplete="off"></label>
            </div>
            <details id="exampleDetails">
                <summary>添加例句 <span>可选</span></summary>
                <div class="fields example-fields">
                    <div class="example-field">
                        <label for="exampleSentence">英文例句</label>
                        <div class="example-field-input">
                            <textarea id="exampleSentence" rows="2" lang="en" placeholder="I looked forward to seeing you."></textarea>
                            <button class="icon-button ai-button" id="generateExample" type="button" title="AI 生成例句、挖空和翻译" aria-label="AI 生成例句、挖空和翻译">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="m4 19 2 2L19 8l-2-2L4 19Zm10-10 2 2M6 3v6M3 6h6m11 8v6m-3-3h6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <label>挖空内容<input id="exampleTarget" lang="en" placeholder="留空时使用词条"></label>
                    <div class="selection-help"><small>词形变化时，可在例句里选中实际文本。</small><button class="text-button" id="useSelection" type="button">使用选中文本</button></div>
                    <label>整句翻译<textarea id="exampleTranslation" rows="2" placeholder="我当时很期待见到你。"></textarea></label>
                    <p id="exampleAiStatus" class="example-ai-status" role="status"></p>
                </div>
            </details>
            <p class="form-error" id="entryError" role="alert" hidden></p>
            <div class="dialog-actions">
                <button class="text-button danger" id="clearExample" type="button" hidden>清除例句</button>
                <button class="button secondary" type="button" data-close>取消</button>
                <button class="button primary" id="saveEntry" type="submit">保存词条</button>
            </div>
        </form>
    </dialog>

    <dialog id="importDialog" aria-labelledby="importTitle">
        <form id="importForm" class="dialog-form">
            <div class="dialog-heading">
                <div><h2 id="importTitle">批量导入</h2><p>支持 CSV 与 JSON 文件，自动跳过重复或缺少释义的词条。</p></div>
                <button class="icon-button" type="button" data-close aria-label="关闭"><span data-icon="close"></span></button>
            </div>
            <div class="import-template">
                <span>先下载模板：</span>
                <button class="text-button" type="button" id="downloadCsv">CSV 模板</button>
                <button class="text-button" type="button" id="downloadJson">JSON 模板</button>
            </div>
            <label class="import-drop" for="importFile">
                <input id="importFile" type="file" accept=".csv,.json,text/csv,application/json" hidden>
                <span data-icon="upload"></span>
                <strong>选择 CSV 或 JSON 文件</strong>
                <small id="importFileName">点击选择文件，自动解析并预览</small>
            </label>
            <div id="importPreview" class="import-preview" hidden>
                <p class="import-summary" id="importSummary"></p>
                <ul class="import-list" id="importList"></ul>
            </div>
            <p class="form-error" id="importError" role="alert" hidden></p>
            <div class="dialog-actions">
                <button class="button secondary" type="button" data-close>取消</button>
                <button class="button primary" id="confirmImport" type="submit" disabled>开始导入</button>
            </div>
        </form>
    </dialog>

    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
        <form id="settingsForm" class="dialog-form">
            <div class="dialog-heading"><h2 id="settingsTitle">学习设置</h2><button class="icon-button" type="button" data-close aria-label="关闭"><span data-icon="close"></span></button></div>
            <div class="fields">
                <label>每组新词数量<input type="number" id="dailyCount" min="1" max="50" required></label>
                <label><span class="range-label">目标记忆保持率 <output id="retentionValue" for="desiredRetention"></output></span>
                    <input type="range" id="desiredRetention" min="0.80" max="0.95" step="0.01">
                    <small>目标越高，FSRS 安排的复习越频繁。稳定性达到 365 天的词条会标记为已掌握。</small>
                </label>
                <label>评级方式<select id="ratingUI">
                    <option value="adaptive">自适应 · 答错自动记为忘记</option>
                    <option value="always4">四档 · 忘记 / 较难 / 记得 / 轻松</option>
                    <option value="simple3">三档 · 忘记 / 记得 / 轻松</option>
                </select></label>
            </div>
            <div class="dialog-actions"><button class="button secondary" type="button" data-close>取消</button><button class="button primary" type="submit">保存设置</button></div>
        </form>
    </dialog>

    <dialog id="deleteDialog" aria-labelledby="deleteTitle">
        <form id="deleteForm" class="dialog-form">
            <div class="dialog-heading"><h2 id="deleteTitle">删除词条</h2><button class="icon-button" type="button" data-close aria-label="关闭"><span data-icon="close"></span></button></div>
            <p id="deleteDescription"></p>
            <p class="form-error" id="deleteError" role="alert" hidden></p>
            <div class="dialog-actions"><button class="button secondary" type="button" data-close autofocus>取消</button><button class="button destructive" id="confirmDelete" type="submit">删除</button></div>
        </form>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
